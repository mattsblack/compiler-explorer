# Default settings for Groovy
compilers=&groovy
compilerType=groovy
versionFlag=--version
objdumper=javap
instructionSet=java

group.groovy.compilers=groovycdefault
compiler.groovycdefault.exe=/usr/bin/groovyc
compiler.groovycdefault.name=groovyc default
compiler.groovycdefault.runtime=/usr/bin/java
compiler.groovycdefault.groovy_home=/usr/share/groovy

defaultCompiler=groovycdefault
demangler=
postProcess=
options=
supportsBinary=false
needsMulti=false
supportsExecute=true
interpreted=true